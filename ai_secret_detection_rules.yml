rules:
  - id: hf-token
    severity: ERROR
    message: "Hardcoded HuggingFace token detected."
    languages: [python]
    pattern-regex: "hf_[A-Za-z0-9]{30,}"

  - id: openai-key
    severity: ERROR
    message: "Hardcoded OpenAI API key detected."
    languages: [python]
    pattern-regex: "sk-[A-Za-z0-9]{20,}"

  - id: aws-access-key
    severity: ERROR
    message: "Hardcoded AWS access key detected."
    languages: [python]
    pattern-regex: "AKIA[0-9A-Z]{16}"

